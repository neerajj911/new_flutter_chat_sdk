// Top-level build file for KotlinDemoApp
// Uses legacy buildscript + allprojects style (NOT plugins block with dependencyResolutionManagement)
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Flutter engine transitive dependencies
        maven { url "https://storage.googleapis.com/download.flutter.io" }
        // Flutter Chat SDK from GitHub Pages Maven repo
        // TODO: Replace <username> and <repo> with your actual GitHub username and repo name
        maven { url "https://<username>.github.io/flutter-chat-sdk/maven" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
