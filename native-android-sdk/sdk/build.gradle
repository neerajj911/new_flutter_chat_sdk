apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

android {
    namespace 'com.flutterchat.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Flutter module — the entire maven repo from 'flutter build aar' is at ../flutter-repo/
    // This pulls in the Flutter engine deps transitively
    implementation 'com.flutterchat.module:flutter_release:1.0'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

def mavenRepoUrl = project.hasProperty('MAVEN_REPO_URL')
        ? project.property('MAVEN_REPO_URL')
        : "file://${buildDir}/maven-repo"

def sdkVersion = project.hasProperty('SDK_VERSION')
        ? project.property('SDK_VERSION')
        : '0.0.1-SNAPSHOT'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.flutterchat'
                artifactId = 'chat-sdk'
                version = sdkVersion

                pom {
                    name = 'Flutter Chat SDK'
                    description = 'A native Android SDK wrapping a Flutter chat module'
                }
            }
        }
        repositories {
            maven {
                url = mavenRepoUrl
            }
        }
    }
}
