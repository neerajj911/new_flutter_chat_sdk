// Top-level build file for native-android-sdk
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://storage.googleapis.com/download.flutter.io" }
        // Flutter module AAR repo (built by 'flutter build aar', path passed via -P in CI)
        if (rootProject.hasProperty('FLUTTER_MODULE_REPO')) {
            maven { url rootProject.property('FLUTTER_MODULE_REPO') }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
