name: Publish Native SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version to publish (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Strip version prefix and set env
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Flutter AAR
        working-directory: flutter_chat_module
        run: |
          flutter build aar --no-profile --no-debug --build-number ${{ env.VERSION }}

      - name: Get exact Flutter engine version
        run: |
          ENGINE_REV=$(flutter --version --machine | python3 -c "import sys,json; v=json.load(sys.stdin); print(v['engineRevision'])")
          FLUTTER_ENGINE_VERSION="1.0.0-${ENGINE_REV}"
          echo "FLUTTER_ENGINE_VERSION=$FLUTTER_ENGINE_VERSION" >> $GITHUB_ENV
          echo "Flutter engine version: $FLUTTER_ENGINE_VERSION"

      - name: Copy Flutter maven repo to native SDK
        run: |
          echo "=== Flutter AAR repo contents ==="
          find flutter_chat_module/build/host/outputs/repo -type f
          cp -r flutter_chat_module/build/host/outputs/repo native-android-sdk/flutter-repo

      - name: Detect Flutter module AAR version
        run: |
          # The version Flutter publishes to Maven equals the pubspec version string.
          # Read it from the actual directory created by 'flutter build aar'.
          FLUTTER_MODULE_VERSION=$(ls flutter_chat_module/build/host/outputs/repo/com/flutterchat/module/flutter_release/ | head -1)
          echo "FLUTTER_MODULE_VERSION=$FLUTTER_MODULE_VERSION" >> $GITHUB_ENV
          echo "Flutter module AAR version: $FLUTTER_MODULE_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build and publish SDK to local Maven repo
        working-directory: native-android-sdk
        run: |
          gradle :sdk:publish \
            -PMAVEN_REPO_URL="file://$PWD/build/maven-repo" \
            -PSDK_VERSION=${{ env.VERSION }} \
            -PFLUTTER_ENGINE_VERSION="${{ env.FLUTTER_ENGINE_VERSION }}" \
            -PFLUTTER_MODULE_VERSION="${{ env.FLUTTER_MODULE_VERSION }}"

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Save artifacts to /tmp BEFORE switching branches
          mkdir -p /tmp/maven-artifacts
          cp -r flutter_chat_module/build/host/outputs/repo/* /tmp/maven-artifacts/
          cp -r native-android-sdk/build/maven-repo/* /tmp/maven-artifacts/

          # Fetch and switch to gh-pages (create orphan if first time)
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Hard-reset to remote so we are always fast-forwardable
          git reset --hard origin/gh-pages 2>/dev/null || true

          # Merge new artifacts — older version dirs are untouched
          mkdir -p maven
          cp -r /tmp/maven-artifacts/* maven/
          touch .nojekyll

          git add maven/ .nojekyll
          git commit -m "Publish SDK v${{ env.VERSION }}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Delete existing release and tag if re-running same version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ env.VERSION }}" --yes || true
          git push origin --delete "v${{ env.VERSION }}" || true
          # Create a lightweight tag on the main branch SHA this workflow ran from
          git tag "v${{ env.VERSION }}" ${{ github.sha }}
          git push origin "v${{ env.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Flutter Chat SDK v${{ env.VERSION }}"
          body: |
            ## Flutter Chat SDK v${{ env.VERSION }}

            ### Installation

            Add to your `build.gradle` repositories:
            ```groovy
            maven { url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/maven" }
            maven { url "https://storage.googleapis.com/download.flutter.io" }
            ```

            Add the dependency:
            ```groovy
            implementation 'com.flutterchat:chat-sdk:${{ env.VERSION }}'
            ```
          generate_release_notes: true
