name: Publish Native SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version to publish (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Strip version prefix and set env
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Flutter AAR
        working-directory: flutter_chat_module
        run: |
          flutter build aar --no-profile --no-debug --build-number 1

      - name: Copy Flutter maven repo to native SDK
        run: |
          echo "=== Flutter AAR repo contents ==="
          find flutter_chat_module/build/host/outputs/repo -type f
          # Copy the ENTIRE local maven repo output (includes AAR + POM + engine dep refs)
          cp -r flutter_chat_module/build/host/outputs/repo native-android-sdk/flutter-repo
          echo "=== Copied to native-android-sdk/flutter-repo ==="
          find native-android-sdk/flutter-repo -type f

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build and publish SDK to local Maven repo
        working-directory: native-android-sdk
        run: |
          gradle :sdk:publish \
            -PMAVEN_REPO_URL="file://$PWD/build/maven-repo" \
            -PSDK_VERSION=${{ env.VERSION }}

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Fetch gh-pages or create it
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

          # Clean working tree but keep maven/ directory
          git rm -rf . || true
          mkdir -p maven

          # Copy Flutter module maven artifacts (so consumers can resolve transitive deps)
          cp -r flutter_chat_module/build/host/outputs/repo/* maven/
          # Copy native SDK maven artifacts
          cp -r native-android-sdk/build/maven-repo/* maven/

          # Commit and push
          git add maven/
          git commit -m "Publish SDK v${{ env.VERSION }}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Flutter Chat SDK v${{ env.VERSION }}"
          body: |
            ## Flutter Chat SDK v${{ env.VERSION }}

            ### Installation

            Add to your `build.gradle` repositories:
            ```groovy
            maven { url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/maven" }
            maven { url "https://storage.googleapis.com/download.flutter.io" }
            ```

            Add the dependency:
            ```groovy
            implementation 'com.flutterchat:chat-sdk:${{ env.VERSION }}'
            ```
          generate_release_notes: true
